# Local overrides. Do not edit docker-compose.yml.
# PlayerStart.CustomSpells lets off-race classes receive their starter spells.
# MinLevelForHeroicCharacter 0 removes the level 55 account requirement for Death Knights.
# ModWarEffort.Enable turns on the Gates of Ahn'Qiraj war effort.
# IndividualProgression.Enable 0 stops zone, raid, and level locks.
# Logout.LogoutDelay is milliseconds. 5000 is a 5 second logout.
# Rate.Corpse.Decay.Looted is required by mod-aoe-loot so looted corpses disappear quickly.
# DungeonRespawn.Enable sends a dead player back to the dungeon entrance.
# NoProfessionLimit raises the primary profession cap to all 11.
# AccountBound shares achievements, mounts, pets, titles, and reputation across the account.
# StarterGear.Enable lets a character use .startergear once.
# DungeonQuests.Enable adds the dungeon quest guide and the accept-all option.
# AllowTwoSide lets opposite factions group, trade, chat, mail, and guild.
services:
  ac-worldserver:
    environment:
      AC_PLAYER_START_CUSTOM_SPELLS: "1"
      AC_CHARACTER_CREATING_MIN_LEVEL_FOR_HEROIC_CHARACTER: "0"
      AC_MOD_WAR_EFFORT_ENABLE: "1"
      AC_ENABLE_PLAYER_SETTINGS: "1"
      AC_DBC_ENFORCE_ITEM_ATTRIBUTES: "0"
      AC_INDIVIDUAL_PROGRESSION_ENABLE: "0"
      AC_LOGOUT_LOGOUT_DELAY: "5000"
      AC_RATE_CORPSE_DECAY_LOOTED: "0.01"
      AC_AOE_LOOT_ENABLE: "1"
      AC_AOE_LOOT_RANGE: "55.0"
      AC_DUNGEON_RESPAWN_ENABLE: "1"
      AC_DUNGEON_RESPAWN_RESPAWN_HEALTH_PCT: "100.0"
      AC_NO_PROFESSION_LIMIT_ENABLE: "1"
      AC_NO_PROFESSION_LIMIT_MAX_PRIMARY_PROFESSIONS: "11"
      AC_ACCOUNT_BOUND_ENABLE: "1"
      AC_STARTER_GEAR_ENABLE: "1"
      AC_DUNGEON_QUESTS_ENABLE: "1"
      AC_DUNGEON_QUESTS_ENABLE_ACCEPT_ALL: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_GROUP: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_GUILD: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_CHAT: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_CHANNEL: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_MAIL: "1"
      AC_ALLOW_TWO_SIDE_INTERACTION_AUCTION: "1"
      AC_ALLOW_TWO_SIDE_TRADE: "1"
      AC_ALLOW_TWO_SIDE_WHO_LIST: "1"
      AC_ALLOW_TWO_SIDE_ADD_FRIEND: "1"
